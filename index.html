
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purple & Blue Calculator</title>

    <style>
        /* =========================
           RESET & COLORS
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #eef0ff;
            --button: #f1f3ff;

            --purple: #7c3aed;
            --purple-dark: #5b21b6;

            --blue: #2563eb;
            --blue-dark: #1d4ed8;

            --text: #172554;
            --white: #ffffff;

            --shadow-dark: #c4c9df;
            --shadow-light: #ffffff;
        }

        /* =========================
           BODY
        ========================= */

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at top left,
                    #ddd6fe 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #bfdbfe 0%,
                    transparent 35%
                ),
                var(--background);

            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           CALCULATOR
        ========================= */

        .calculator {
            width: min(430px, 94vw);

            padding: 25px;

            border-radius: 35px;

            background: var(--background);

            box-shadow:
                18px 18px 35px var(--shadow-dark),
                -18px -18px 35px var(--shadow-light);
        }

        /* =========================
           DISPLAY
        ========================= */

        .display {
            width: 100%;
            min-height: 170px;

            margin-bottom: 25px;
            padding: 25px;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;

            overflow: hidden;

            border-radius: 30px;

            background: var(--background);

            box-shadow:
                inset 8px 8px 18px var(--shadow-dark),
                inset -8px -8px 18px var(--shadow-light);
        }

        .previous-display {
            width: 100%;
            min-height: 30px;

            color: #64748b;

            font-size: 20px;
            font-weight: 500;

            text-align: right;

            overflow: hidden;
        }

        .current-display {
            width: 100%;

            margin-top: 8px;

            color: var(--text);

            font-size: clamp(38px, 9vw, 58px);
            font-weight: 600;

            text-align: right;

            overflow: hidden;
        }

        /* =========================
           BUTTON GRID
        ========================= */

        .buttons {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 18px;
        }

        /* =========================
           GENERAL BUTTON
        ========================= */

        .button {
            border: none;

            min-height: 75px;

            border-radius: 24px;

            background: var(--button);

            color: var(--text);

            font-size: 24px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                8px 8px 16px var(--shadow-dark),
                -8px -8px 16px var(--shadow-light);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                color 0.15s ease;
        }

        .button:active {
            transform: scale(0.94);

            box-shadow:
                inset 5px 5px 10px var(--shadow-dark),
                inset -5px -5px 10px var(--shadow-light);
        }

        /* =========================
           NUMBERS
        ========================= */

        .number {
            color: var(--text);
        }

        /* =========================
           FUNCTIONS
        ========================= */

        .function {
            color: var(--purple);
            font-weight: 700;
        }

        /* =========================
           OPERATORS
        ========================= */

        .operator {
            color: var(--blue);
            font-weight: 700;
        }

        /* =========================
           EQUALS
        ========================= */

        .equals {
            background: linear-gradient(
                135deg,
                var(--purple),
                var(--blue)
            );

            color: var(--white);

            box-shadow:
                8px 8px 16px #c1c5dc,
                -8px -8px 16px var(--shadow-light);
        }

        .equals:active {
            box-shadow:
                inset 5px 5px 12px var(--purple-dark),
                inset -5px -5px 12px var(--blue);
        }

        /* =========================
           ZERO
        ========================= */

        .zero {
            grid-column: span 2;
        }

        /* =========================
           HOVER
        ========================= */

        @media (hover: hover) {

            .button:hover {
                transform: translateY(-3px);
            }

            .number:hover {
                color: var(--blue);
            }

            .function:hover {
                color: var(--purple-dark);
            }

            .operator:hover {
                color: var(--blue-dark);
            }

            .equals:hover {
                background: linear-gradient(
                    135deg,
                    var(--purple-dark),
                    var(--blue-dark)
                );
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            .calculator {
                width: 94vw;
                padding: 18px;
                border-radius: 28px;
            }

            .display {
                min-height: 145px;
                padding: 20px;
                border-radius: 25px;
            }

            .buttons {
                gap: 14px;
            }

            .button {
                min-height: 68px;
                border-radius: 20px;
                font-size: 21px;
            }

            .current-display {
                font-size: 42px;
            }
        }
    </style>
</head>

<body>

    <!-- CALCULATOR -->
    <main class="calculator">

        <!-- DISPLAY -->
        <section class="display">

            <div
                class="previous-display"
                id="previousDisplay">
            </div>

            <div
                class="current-display"
                id="currentDisplay">
                0
            </div>

        </section>

        <!-- BUTTONS -->
        <div class="buttons">

            <!-- ROW 1 -->
            <button class="button function" data-action="clear">AC</button>
            <button class="button function" data-action="delete">DEL</button>
            <button class="button operator" data-operation="÷">÷</button>
            <button class="button operator" data-operation="%">%</button>

            <!-- ROW 2 -->
            <button class="button number" data-number="7">7</button>
            <button class="button number" data-number="8">8</button>
            <button class="button number" data-number="9">9</button>
            <button class="button operator" data-operation="×">×</button>

            <!-- ROW 3 -->
            <button class="button number" data-number="4">4</button>
            <button class="button number" data-number="5">5</button>
            <button class="button number" data-number="6">6</button>
            <button class="button operator" data-operation="-">−</button>

            <!-- ROW 4 -->
            <button class="button number" data-number="1">1</button>
            <button class="button number" data-number="2">2</button>
            <button class="button number" data-number="3">3</button>
            <button class="button operator" data-operation="+">+</button>

            <!-- ROW 5 -->
            <button class="button number zero" data-number="0">0</button>
            <button class="button number" data-number=".">.</button>
            <button class="button equals" data-action="calculate">=</button>

        </div>

    </main>

    <!-- JAVASCRIPT -->
    <script>

        /* =========================
           SELECT ELEMENTS
        ========================= */

        const currentDisplay = document.getElementById("currentDisplay");
        const previousDisplay = document.getElementById("previousDisplay");

        let currentValue = "";
        let previousValue = "";
        let operation = null;


        /* =========================
           UPDATE DISPLAY
        ========================= */

        function updateDisplay() {

            currentDisplay.textContent = currentValue || "0";

            if (operation && previousValue) {
                previousDisplay.textContent =
                    `${previousValue} ${operation}`;
            } else {
                previousDisplay.textContent = "";
            }

        }


        /* =========================
           ADD NUMBER
        ========================= */

        function addNumber(number) {

            if (currentValue === "Error") {
                currentValue = "";
            }

            if (number === "." && currentValue.includes(".")) {
                return;
            }

            if (currentValue === "0" && number !== ".") {
                currentValue = "";
            }

            currentValue += number;

            updateDisplay();

        }


        /* =========================
           CHOOSE OPERATION
        ========================= */

        function chooseOperation(selectedOperation) {

            if (!currentValue || currentValue === "Error") {
                return;
            }

            if (previousValue && operation && currentValue) {
                calculate();
            }

            previousValue = currentValue;

            currentValue = "";

            operation = selectedOperation;

            updateDisplay();

        }


        /* =========================
           CALCULATE
        ========================= */

        function calculate() {

            if (!previousValue || !currentValue || !operation) {
                return;
            }

            const firstNumber = parseFloat(previousValue);
            const secondNumber = parseFloat(currentValue);

            let result;

            switch (operation) {

                case "+":
                    result = firstNumber + secondNumber;
                    break;

                case "-":
                    result = firstNumber - secondNumber;
                    break;

                case "×":
                    result = firstNumber * secondNumber;
                    break;

                case "÷":

                    if (secondNumber === 0) {
                        currentValue = "Error";
                        previousValue = "";
                        operation = null;

                        updateDisplay();
                        return;
                    }

                    result = firstNumber / secondNumber;
                    break;

                case "%":
                    result = firstNumber % secondNumber;
                    break;

                default:
                    return;

            }

            currentValue = String(
                Math.round(result * 100000000) / 100000000
            );

            previousValue = "";
            operation = null;

            updateDisplay();

        }


        /* =========================
           CLEAR ALL
        ========================= */

        function clearCalculator() {

            currentValue = "";
            previousValue = "";
            operation = null;

            updateDisplay();

        }


        /* =========================
           DELETE LAST NUMBER
        ========================= */

        function deleteNumber() {

            if (currentValue === "Error") {
                currentValue = "";
            } else {
                currentValue = currentValue.slice(0, -1);
            }

            updateDisplay();

        }


        /* =========================
           NUMBER BUTTON EVENTS
        ========================= */

        document.querySelectorAll(".number").forEach(button => {

            button.addEventListener("click", () => {

                addNumber(button.dataset.number);

            });

        });


        /* =========================
           OPERATOR BUTTON EVENTS
        ========================= */

        document.querySelectorAll("[data-operation]").forEach(button => {

            button.addEventListener("click", () => {

                chooseOperation(button.dataset.operation);

            });

        });


        /* =========================
           FUNCTION BUTTON EVENTS
        ========================= */

        document.querySelector('[data-action="clear"]')
            .addEventListener("click", clearCalculator);

        document.querySelector('[data-action="delete"]')
            .addEventListener("click", deleteNumber);

        document.querySelector('[data-action="calculate"]')
            .addEventListener("click", calculate);


        /* =========================
           KEYBOARD SUPPORT
        ========================= */

        document.addEventListener("keydown", event => {

            if (event.key >= "0" && event.key <= "9") {
                addNumber(event.key);
            }

            if (event.key === ".") {
                addNumber(".");
            }

            if (event.key === "+") {
                chooseOperation("+");
            }

            if (event.key === "-") {
                chooseOperation("-");
            }

            if (event.key === "*") {
                chooseOperation("×");
            }

            if (event.key === "/") {
                event.preventDefault();
                chooseOperation("÷");
            }

            if (event.key === "%") {
                chooseOperation("%");
            }

            if (event.key === "Enter" || event.key === "=") {
                event.preventDefault();
                calculate();
            }

            if (event.key === "Backspace") {
                deleteNumber();
            }

            if (event.key === "Escape") {
                clearCalculator();
            }

        });

        updateDisplay();

    </script>

</body>
</html>
